<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMI Calculator</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    padding:20px;
}

.container{
    width:100%;
    max-width:650px;
    background:white;
    border-radius:20px;
    padding:30px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    color:#3498db;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:15px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:5px;
}

input,select{
    width:100%;
    padding:12px;
    border:2px solid #dfe6e9;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    margin-top:10px;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#3498db;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#2980b9;
}

.result{
    margin-top:20px;
    padding:20px;
    border-radius:15px;
    display:none;
}

.result h2{
    margin-bottom:15px;
}

.bmi-number{
    font-size:40px;
    font-weight:bold;
    margin:10px 0;
}

.normal{
    background:#d4edda;
}

.underweight{
    background:#d1ecf1;
}

.overweight{
    background:#fff3cd;
}

.obese{
    background:#f8d7da;
}

.info-card{
    margin-top:15px;
    background:#f8f9fa;
    padding:15px;
    border-radius:10px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th{
    background:#3498db;
    color:white;
}

td,th{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

.warning{
    margin-top:12px;
    color:#e67e22;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>🏥 BMI Calculator</h1>

<div class="form-group">
<label>อายุ (ปี)</label>
<input type="number" id="age" step="0.1" placeholder="เช่น 18 หรือ 17.5">
</div>

<div class="form-group">
<label>เพศ</label>
<select id="gender">
<option value="male">ชาย</option>
<option value="female">หญิง</option>
</select>
</div>

<div class="form-group">
<label>น้ำหนัก (กิโลกรัม)</label>
<input type="number" id="weight" step="0.1" placeholder="เช่น 52.5">
</div>

<div class="form-group">
<label>ส่วนสูง (เซนติเมตร)</label>
<input type="number" id="height" step="0.1" placeholder="เช่น 163.5">
</div>

<button onclick="calculateBMI()">
คำนวณ BMI
</button>

<div id="result" class="result">
<h2>ผลลัพธ์</h2>

<div class="bmi-number" id="bmiValue"></div>

<h3 id="status"></h3>

<div class="info-card">
<p><strong>น้ำหนักที่เหมาะสม:</strong></p>
<p id="idealWeight"></p>
</div>

<div class="info-card">
<p><strong>คำแนะนำ:</strong></p>
<p id="suggestion"></p>
</div>

<div id="childNotice" class="warning"></div>

</div>

<table>
<tr>
<th>BMI</th>
<th>ระดับ</th>
</tr>

<tr>
<td>ต่ำกว่า 18.5</td>
<td>น้ำหนักน้อย</td>
</tr>

<tr>
<td>18.5 - 22.9</td>
<td>ปกติ</td>
</tr>

<tr>
<td>23 - 24.9</td>
<td>น้ำหนักเกิน</td>
</tr>

<tr>
<td>25 - 29.9</td>
<td>อ้วนระดับ 1</td>
</tr>

<tr>
<td>30 ขึ้นไป</td>
<td>อ้วนระดับ 2</td>
</tr>

</table>

</div>

<script>

function calculateBMI(){

const age =
parseFloat(document.getElementById("age").value);

const weight =
parseFloat(document.getElementById("weight").value);

const height =
parseFloat(document.getElementById("height").value);

const result =
document.getElementById("result");

if(
isNaN(age) ||
isNaN(weight) ||
isNaN(height)
){
alert("กรุณากรอกข้อมูลให้ครบ");
return;
}

if(age<=0||age>120){
alert("อายุไม่ถูกต้อง");
return;
}

if(weight<=0||weight>500){
alert("น้ำหนักไม่ถูกต้อง");
return;
}

if(height<30||height>300){
alert("ส่วนสูงไม่ถูกต้อง");
return;
}

const h = height/100;

const bmi = weight/(h*h);

let status="";
let suggestion="";
let className="";

if(bmi<18.5){

status="🟦 น้ำหนักน้อย";
suggestion=
"ควรรับประทานอาหารให้ครบ 5 หมู่ และเพิ่มพลังงานอย่างเหมาะสม";
className="underweight";

}
else if(bmi<23){

status="🟩 น้ำหนักปกติ";
suggestion=
"รักษาพฤติกรรมการกินและการออกกำลังกายอย่างสม่ำเสมอ";
className="normal";

}
else if(bmi<25){

status="🟨 น้ำหนักเกิน";
suggestion=
"ควรควบคุมอาหารหวาน มัน เค็ม และออกกำลังกายเพิ่มขึ้น";
className="overweight";

}
else if(bmi<30){

status="🟧 โรคอ้วนระดับ 1";
suggestion=
"ควรลดน้ำหนักอย่างจริงจัง และออกกำลังกายสม่ำเสมอ";
className="obese";

}
else{

status="🟥 โรคอ้วนระดับ 2";
suggestion=
"ควรปรึกษาแพทย์หรือผู้เชี่ยวชาญด้านโภชนาการ";
className="obese";

}

const minWeight =
18.5*(h*h);

const maxWeight =
22.9*(h*h);

result.style.display="block";
result.className="result "+className;

document.getElementById("bmiValue").innerHTML=
bmi.toFixed(2);

document.getElementById("status").innerHTML=
status;

document.getElementById("idealWeight").innerHTML=
minWeight.toFixed(1)
+" - "+
maxWeight.toFixed(1)
+" กิโลกรัม";

document.getElementById("suggestion").innerHTML=
suggestion;

if(age<18){

document.getElementById("childNotice").innerHTML=
"⚠️ ผู้ที่อายุต่ำกว่า 18 ปี ควรใช้ BMI ร่วมกับเกณฑ์อายุและเพศ (BMI-for-Age Percentile) เพื่อการประเมินที่แม่นยำมากขึ้น";

}else{

document.getElementById("childNotice").innerHTML="";
}

}

</script>

</body>
</html>
